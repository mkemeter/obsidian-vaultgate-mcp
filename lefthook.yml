pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --exit-code 1
    biome:
      root: "server/"
      run: npm run check
    biome-tray:
      root: "tray/"
      run: npm run check
    typecheck-server:
      root: "server/"
      run: npm run typecheck
    typecheck-tray:
      root: "tray/"
      run: npm run typecheck
    type-coverage:
      root: "server/"
      run: npm run type-coverage
    type-coverage-tray:
      root: "tray/"
      run: npm run type-coverage
    sync-server-readme:
      run: node scripts/sync-readme.js

pre-push:
  parallel: true
  commands:
    test-server:
      root: "server/"
      run: npm run test:coverage
    test-tray:
      root: "tray/"
      run: npm run test:coverage
    audit-server:
      root: "server/"
      run: npm audit --audit-level=high --omit=dev --omit=optional
    audit-tray:
      root: "tray/"
      run: npm audit --audit-level=high --omit=dev --omit=optional
