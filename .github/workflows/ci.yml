name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Biome check
        run: npm run check
      - name: Type-check
        run: npm run typecheck
      - name: Dead-code check
        run: npx knip
      - name: Type coverage
        run: npm run type-coverage

  lint-tray:
    name: Tray Lint, Type-check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Biome check
        run: npm run check
      - name: Type-check
        run: npm run typecheck
      - name: Dead-code check
        run: npx knip
      - name: Type coverage
        run: npm run type-coverage
      - name: Run tests
        run: npm test

  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev --omit=optional

  audit-tray:
    name: Security Audit (tray)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev --omit=optional

  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sync version from VERSION file
        run: node ../scripts/sync-version.js
      - name: Build
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node-version == 20 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  package-smoke:
    name: Pack & Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sync version from VERSION file
        run: node ../scripts/sync-version.js
      - name: Build
        run: npm run build
      - name: Pack
        run: npm pack
      - name: Smoke test
        run: node scripts/smoke.mjs obsidian-vaultgate-mcp-*.tgz

  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      tray: ${{ steps.filter.outputs.tray }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            tray:
              - 'tray/**'
            deploy:
              - 'server/deploy/**'

  lint-scripts:
    name: Lint deploy scripts
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # shellcheck and pwsh are preinstalled on the GitHub ubuntu-latest image.
      - name: Shell scripts — syntax check
        run: |
          for f in server/deploy/*.sh; do
            echo "== bash -n $f =="
            bash -n "$f"
          done
      - name: Shell scripts — shellcheck
        run: shellcheck server/deploy/*.sh
      - name: PowerShell scripts — ASCII-only guard
        # Windows PowerShell 5.1 reads BOM-less .ps1 files as the system ANSI
        # codepage, mojibake-ing any non-ASCII byte. Keep these scripts ASCII.
        run: |
          fail=0
          for f in server/deploy/*.ps1; do
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::Non-ASCII bytes in a BOM-less .ps1 file (breaks Windows PowerShell 5.1)"
              fail=1
            fi
          done
          exit $fail
      - name: PowerShell scripts — parse check + PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $failed = $false
          foreach ($s in Get-ChildItem -Path server/deploy -Filter *.ps1 -File) {
            Write-Host "== $($s.Name) =="
            # Hard gate: any parse error (unbalanced quotes, bad delimiters, ...) fails the build.
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($s.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
            # PSScriptAnalyzer: Errors block the build. Write-Host is intentional installer UX.
            # Warnings are surfaced but non-blocking until the baseline is clean.
            $findings = Invoke-ScriptAnalyzer -Path $s.FullName -ExcludeRule PSAvoidUsingWriteHost
            if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host }
            if ($findings | Where-Object { $_.Severity -eq 'Error' }) { $failed = $true }
          }
          if ($failed) { throw 'PowerShell script checks failed' }

  windows-e2e:
    name: Windows install e2e
    needs: [changes, test]
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sync version from VERSION file
        run: node ../scripts/sync-version.js
      - name: Build and pack
        run: npm run build && npm pack
      - name: Install globally from tarball
        run: |
          $tgz = Get-ChildItem obsidian-vaultgate-mcp-*.tgz | Select-Object -First 1
          npm install -g $tgz.FullName
      - name: Create dummy Obsidian.exe
        run: |
          $dummy = Join-Path $env:RUNNER_TEMP 'Obsidian.exe'
          Set-Content $dummy 'stub' -Encoding ASCII
          Write-Host "Dummy: $dummy"
      - name: Run installer (non-interactive)
        run: |
          $ErrorActionPreference = 'Stop'
          $dummy = Join-Path $env:RUNNER_TEMP 'Obsidian.exe'
          & "$PWD\deploy\install.ps1" -NonInteractive -ObsidianPath $dummy -VaultName test
      - name: Assert scheduled task registered
        run: Get-ScheduledTask -TaskName 'VaultGate' -ErrorAction Stop | Out-Null
      - name: Start server via wrapper
        run: |
          $wrapper = "$env:APPDATA\VaultGate\start.cmd"
          $script:serverProc = Start-Process $wrapper -PassThru -WindowStyle Hidden
          Write-Host "Server PID: $($script:serverProc.Id)"
          # Store PID for later steps
          $script:serverProc.Id | Out-File "$env:RUNNER_TEMP\server.pid" -Encoding ASCII
      - name: Poll /health endpoint
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3001/health' -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw 'Server did not respond on /health within 60 s' }
          Write-Host 'Health check passed'
      - name: Stop server
        run: |
          $pid = Get-Content "$env:RUNNER_TEMP\server.pid" -ErrorAction SilentlyContinue
          if ($pid) { Stop-Process -Id ([int]$pid) -Force -ErrorAction SilentlyContinue }
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Run uninstaller
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD\deploy\uninstall.ps1"
      - name: Assert scheduled task removed
        run: |
          $task = Get-ScheduledTask -TaskName 'VaultGate' -ErrorAction SilentlyContinue
          if ($task) { throw 'Scheduled task still present after uninstall' }
      - name: Teardown
        if: always()
        run: |
          Unregister-ScheduledTask -TaskName 'VaultGate' -Confirm:$false -ErrorAction SilentlyContinue
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

  mutation:
    name: Stryker (server)
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-server
          path: server/reports/mutation/
          retention-days: 14

  mutation-tray:
    name: Stryker (tray)
    needs: [changes]
    if: needs.changes.outputs.tray == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-tray
          path: tray/reports/mutation/
          retention-days: 14

  ci-passed:
    name: CI passed
    needs: [lint, lint-tray, security, audit, audit-tray, test, package-smoke, changes, lint-scripts, windows-e2e, mutation, mutation-tray]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.lint-tray.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.audit.result }}" != "success" ||
                "${{ needs.audit-tray.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.package-smoke.result }}" != "success" ||
                "${{ needs.changes.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Mutation jobs are path-filtered — "skipped" means no relevant files changed, which is fine
          if [[ "${{ needs.mutation.result }}" != "success" && "${{ needs.mutation.result }}" != "skipped" ]]; then
            echo "Server mutation tests failed"
            exit 1
          fi
          if [[ "${{ needs.mutation-tray.result }}" != "success" && "${{ needs.mutation-tray.result }}" != "skipped" ]]; then
            echo "Tray mutation tests failed"
            exit 1
          fi
          # lint-scripts is path-filtered on server/deploy/** — "skipped" is fine
          if [[ "${{ needs.lint-scripts.result }}" != "success" && "${{ needs.lint-scripts.result }}" != "skipped" ]]; then
            echo "Deploy script lint failed"
            exit 1
          fi
          # windows-e2e is path-filtered on server or deploy changes — "skipped" is fine
          if [[ "${{ needs.windows-e2e.result }}" != "success" && "${{ needs.windows-e2e.result }}" != "skipped" ]]; then
            echo "Windows e2e install test failed"
            exit 1
          fi
