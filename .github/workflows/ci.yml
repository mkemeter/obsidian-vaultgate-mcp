name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Biome check
        run: npm run check
      - name: Type-check
        run: npm run typecheck
      - name: Dead-code check
        run: npx knip
      - name: Type coverage
        run: npm run type-coverage

  lint-tray:
    name: Tray Lint, Type-check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Biome check
        run: npm run check
      - name: Type-check
        run: npm run typecheck
      - name: Dead-code check
        run: npx knip
      - name: Type coverage
        run: npm run type-coverage
      - name: Run tests
        run: npm test

  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev --omit=optional

  audit-tray:
    name: Security Audit (tray)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev --omit=optional

  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sync version from VERSION file
        run: node ../scripts/sync-version.js
      - name: Build
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  package-smoke:
    name: Pack & Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sync version from VERSION file
        run: node ../scripts/sync-version.js
      - name: Build
        run: npm run build
      - name: Pack
        run: npm pack
      - name: Smoke test
        run: node scripts/smoke.mjs obsidian-vaultgate-mcp-*.tgz

  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      tray: ${{ steps.filter.outputs.tray }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            tray:
              - 'tray/**'
            deploy:
              - 'server/deploy/**'

  lint-scripts:
    name: Lint deploy scripts
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # shellcheck and pwsh are preinstalled on the GitHub ubuntu-latest image.
      - name: Shell scripts — syntax check
        run: |
          for f in server/deploy/*.sh; do
            echo "== bash -n $f =="
            bash -n "$f"
          done
      - name: Shell scripts — shellcheck
        run: shellcheck server/deploy/*.sh
      - name: PowerShell scripts — ASCII-only guard
        # Windows PowerShell 5.1 reads BOM-less .ps1 files as the system ANSI
        # codepage, mojibake-ing any non-ASCII byte. Keep these scripts ASCII.
        run: |
          fail=0
          for f in server/deploy/*.ps1; do
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::Non-ASCII bytes in a BOM-less .ps1 file (breaks Windows PowerShell 5.1)"
              fail=1
            fi
          done
          exit $fail
      - name: PowerShell scripts — parse check + PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $failed = $false
          foreach ($s in Get-ChildItem -Path server/deploy -Filter *.ps1 -File) {
            Write-Host "== $($s.Name) =="
            # Hard gate: any parse error (unbalanced quotes, bad delimiters, ...) fails the build.
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($s.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
            # PSScriptAnalyzer: Errors block the build. Write-Host is intentional installer UX.
            # Warnings are surfaced but non-blocking until the baseline is clean.
            $findings = Invoke-ScriptAnalyzer -Path $s.FullName -ExcludeRule PSAvoidUsingWriteHost
            if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host }
            if ($findings | Where-Object { $_.Severity -eq 'Error' }) { $failed = $true }
          }
          if ($failed) { throw 'PowerShell script checks failed' }

  mutation:
    name: Stryker (server)
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-server
          path: server/reports/mutation/
          retention-days: 14

  mutation-tray:
    name: Stryker (tray)
    needs: [changes]
    if: needs.changes.outputs.tray == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-tray
          path: tray/reports/mutation/
          retention-days: 14

  ci-passed:
    name: CI passed
    needs: [lint, lint-tray, security, audit, audit-tray, test, package-smoke, changes, lint-scripts, mutation, mutation-tray]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.lint-tray.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.audit.result }}" != "success" ||
                "${{ needs.audit-tray.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.package-smoke.result }}" != "success" ||
                "${{ needs.changes.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Mutation jobs are path-filtered — "skipped" means no relevant files changed, which is fine
          if [[ "${{ needs.mutation.result }}" != "success" && "${{ needs.mutation.result }}" != "skipped" ]]; then
            echo "Server mutation tests failed"
            exit 1
          fi
          if [[ "${{ needs.mutation-tray.result }}" != "success" && "${{ needs.mutation-tray.result }}" != "skipped" ]]; then
            echo "Tray mutation tests failed"
            exit 1
          fi
          # lint-scripts is path-filtered on server/deploy/** — "skipped" is fine
          if [[ "${{ needs.lint-scripts.result }}" != "success" && "${{ needs.lint-scripts.result }}" != "skipped" ]]; then
            echo "Deploy script lint failed"
            exit 1
          fi
