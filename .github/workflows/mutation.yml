name: Mutation Testing (weekly full scan)

# Stryker full-repo mutation scan, supplementing the per-PR path-filtered jobs in ci.yml.
#
# ci.yml runs Stryker only when server/ or tray/ files changed (path-filtered, blocking).
# This workflow runs on the full codebase weekly to catch slow score drift that per-PR
# path filtering might miss, and on-demand for investigative runs.

on:
  workflow_dispatch:
  schedule:
    # Mondays at 07:17 UTC — off-peak, avoids the top-of-hour API rush.
    - cron: "17 7 * * 1"

jobs:
  mutation:
    name: Stryker (server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-server
          path: server/reports/mutation/
          retention-days: 14

  mutation-tray:
    name: Stryker (tray)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tray/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-tray
          path: tray/reports/mutation/
          retention-days: 14
